# Prometheus scrape config for the VectorFlow local stack.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: vectorflow-local

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: vectorflow-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ['gateway:8080']

  - job_name: vectorflow-worker
    metrics_path: /metrics
    static_configs:
      - targets: ['worker:8081']

  - job_name: vectorflow-inference
    metrics_path: /metrics
    static_configs:
      - targets: ['inference:8082']
