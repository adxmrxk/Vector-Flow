# Grafana dashboard provisioning for the VectorFlow local stack.
apiVersion: 1

providers:
  - name: vectorflow
    orgId: 1
    folder: VectorFlow
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
